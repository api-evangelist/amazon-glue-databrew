naftiko: "1.0.0-alpha1"

info:
  label: Amazon Glue DataBrew
  description: Visual data preparation tool with 250+ pre-built transformations for analytics and machine learning data preparation.
  tags:
    - Amazon Glue DataBrew
    - Data Preparation
    - ETL
    - Machine Learning
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: amazon-glue-databrew
      baseUri: https://databrew.amazonaws.com
      description: Amazon Glue DataBrew API
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_AUTH_HEADER}}"
        placement: header
      resources:
        - name: datasets
          path: /datasets
          description: Manage DataBrew datasets
          operations:
            - name: ListDatasets
              method: GET
              description: List all datasets
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateDataset
              method: POST
              description: Create a new dataset
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: DescribeDataset
              method: GET
              description: Get dataset details
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: DeleteDataset
              method: DELETE
              description: Delete a dataset
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: recipes
          path: /recipes
          description: Manage data transformation recipes
          operations:
            - name: ListRecipes
              method: GET
              description: List all recipes
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateRecipe
              method: POST
              description: Create a new recipe
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: PublishRecipe
              method: POST
              description: Publish a recipe version
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: jobs
          path: /jobs
          description: Manage DataBrew transformation jobs
          operations:
            - name: ListJobs
              method: GET
              description: List all jobs
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateRecipeJob
              method: POST
              description: Create a recipe job
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: StartJobRun
              method: POST
              description: Start a job run
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: projects
          path: /projects
          description: Manage DataBrew projects
          operations:
            - name: ListProjects
              method: GET
              description: List all projects
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: CreateProject
              method: POST
              description: Create a new project
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8082
      namespace: glue-databrew-rest-api
      resources:
        - path: /v1/datasets
          name: datasets
          operations:
            - method: GET
              name: list-datasets
              description: List all DataBrew datasets
              call: amazon-glue-databrew.ListDatasets
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9092
      namespace: glue-databrew-mcp
      transport: http
      tools:
        - name: list-datasets
          description: List all DataBrew datasets
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListDatasets
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-dataset
          description: Create a new DataBrew dataset
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateDataset
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-recipes
          description: List all data transformation recipes
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListRecipes
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-recipe
          description: Create a new data transformation recipe
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateRecipe
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-jobs
          description: List all DataBrew jobs
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListJobs
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-job-run
          description: Start a DataBrew job run
          hints:
            readOnly: false
          call: amazon-glue-databrew.StartJobRun
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-projects
          description: List all DataBrew projects
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListProjects
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-project
          description: Create a new DataBrew project
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateProject
          outputParameters:
            - type: object
              mapping: "$."
