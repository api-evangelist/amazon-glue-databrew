naftiko: "1.0.0-alpha1"

info:
  label: Amazon Glue DataBrew Data Preparation
  description: >-
    Workflow capability for data analysts and data scientists preparing data
    using Amazon Glue DataBrew. Covers dataset management, recipe creation,
    job execution, and profiling for analytics and machine learning workflows.
  tags:
    - Amazon Glue DataBrew
    - Data Preparation
    - ETL
    - Analytics
    - Machine Learning
    - AWS
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: amazon-glue-databrew
      location: ./shared/amazon-glue-databrew.yaml

  exposes:
    - type: rest
      port: 8082
      namespace: glue-databrew-data-prep-api
      description: Unified REST API for Amazon Glue DataBrew data preparation workflows.
      resources:
        - path: /v1/datasets
          name: datasets
          description: Manage datasets for transformation
          operations:
            - method: GET
              name: list-datasets
              description: List all DataBrew datasets
              call: amazon-glue-databrew.ListDatasets
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-dataset
              description: Create a new dataset
              call: amazon-glue-databrew.CreateDataset
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/recipes
          name: recipes
          description: Manage data transformation recipes
          operations:
            - method: GET
              name: list-recipes
              description: List all recipes
              call: amazon-glue-databrew.ListRecipes
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-recipe
              description: Create a new recipe
              call: amazon-glue-databrew.CreateRecipe
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/jobs
          name: jobs
          description: Manage and run DataBrew jobs
          operations:
            - method: GET
              name: list-jobs
              description: List all DataBrew jobs
              call: amazon-glue-databrew.ListJobs
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: start-job-run
              description: Start a job execution
              call: amazon-glue-databrew.StartJobRun
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/projects
          name: projects
          description: Manage collaborative DataBrew projects
          operations:
            - method: GET
              name: list-projects
              description: List all projects
              call: amazon-glue-databrew.ListProjects
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9092
      namespace: glue-databrew-data-prep-mcp
      transport: http
      description: MCP server for AI-assisted data preparation using Amazon Glue DataBrew.
      tools:
        - name: list-datasets
          description: List all DataBrew datasets available for preparation
          hints:
            readOnly: true
            openWorld: true
          call: amazon-glue-databrew.ListDatasets
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-dataset
          description: Create a new dataset from S3, database, or other sources
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateDataset
          outputParameters:
            - type: object
              mapping: "$."
        - name: describe-dataset
          description: Get details about a specific dataset
          hints:
            readOnly: true
          call: amazon-glue-databrew.DescribeDataset
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-recipes
          description: List all data transformation recipes
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListRecipes
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-recipe
          description: Create a new recipe with transformation steps
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateRecipe
          outputParameters:
            - type: object
              mapping: "$."
        - name: publish-recipe
          description: Publish a recipe version for production use
          hints:
            readOnly: false
          call: amazon-glue-databrew.PublishRecipe
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-jobs
          description: List all DataBrew transformation and profiling jobs
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListJobs
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-recipe-job
          description: Create a job to apply a recipe to a dataset
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateRecipeJob
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-job-run
          description: Execute a DataBrew transformation or profiling job
          hints:
            readOnly: false
          call: amazon-glue-databrew.StartJobRun
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-job-runs
          description: List all runs for a specific job
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListJobRuns
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-projects
          description: List all collaborative DataBrew projects
          hints:
            readOnly: true
          call: amazon-glue-databrew.ListProjects
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-project
          description: Create a new DataBrew project for collaborative data preparation
          hints:
            readOnly: false
          call: amazon-glue-databrew.CreateProject
          outputParameters:
            - type: object
              mapping: "$."
