aid: amazon-glue-databrew
name: Amazon Glue DataBrew
description: >-
  AWS Glue DataBrew is a visual data preparation tool that makes it easy for
  data analysts and data scientists to clean and normalize data to prepare it
  for analytics and machine learning. It provides over 250 pre-built
  transformations to automate data preparation tasks.
